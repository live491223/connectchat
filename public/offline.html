<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>ConnectChat - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-wrap svg {
      width: 42px;
      height: 42px;
      stroke: #60a5fa;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #ef444422;
      color: #f87171;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .status-text {
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5a6.5 6.5 0 018.8 8.8m2.5-4.3a10.5 10.5 0 00-15.6-7M12 20h.01" />
      </svg>
    </div>
    <span class="badge">Offline Mode</span>
    <h1>No Internet Connection</h1>
    <p>ConnectChat requires a network connection for live messaging. Your cached conversations remain safely stored on this device.</p>
    <button class="btn" onclick="retryConnection()">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Check Connection & Reconnect
    </button>
    <div class="status-text" id="status-info">Waiting for network connectivity...</div>
  </div>

  <script>
    function retryConnection() {
      const status = document.getElementById('status-info');
      status.textContent = 'Checking network status...';
      if (navigator.onLine) {
        status.textContent = 'Connection restored! Reloading ConnectChat...';
        window.location.reload();
      } else {
        setTimeout(() => {
          status.textContent = 'Still offline. Check Wi-Fi or mobile data.';
        }, 800);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('status-info').textContent = 'Online detected! Reconnecting...';
      window.location.reload();
    });
  </script>
</body>
</html>
